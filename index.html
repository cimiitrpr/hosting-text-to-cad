<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIM Text-to-CAD Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/js/controls/OrbitControls.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex h-screen overflow-hidden">

    <!-- LEFT: chat + code -->
    <div class="w-1/3 bg-gray-800 flex flex-col border-r border-gray-700">
        <div class="p-4 border-b border-gray-700">
            <h1 class="text-xl font-bold text-blue-400">CIM Text-to-CAD</h1>
            <p class="text-xs text-gray-400">Chat to build, edit, and export a parametric CAD model</p>
        </div>

        <!-- chat history -->
        <div id="chatLog" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>

        <!-- code output -->
        <div class="border-t border-gray-700 p-3">
            <label class="block text-xs font-medium mb-1 text-gray-400">Compiled CadQuery Script</label>
            <pre id="codeOutput" class="w-full p-2 bg-gray-900 border border-gray-700 rounded text-xs text-green-400 overflow-auto h-32 font-mono">// code will appear here</pre>
        </div>

        <!-- input -->
        <div class="p-3 border-t border-gray-700">
            <div class="flex gap-2 mb-2">
                <input id="promptInput" type="text" placeholder="e.g. Make a 40mm cube with a 10mm hole through the center"
                       class="flex-1 p-2 bg-gray-900 border border-gray-700 rounded text-sm focus:outline-none focus:border-blue-500">
                <button onclick="sendPrompt()" id="btnSubmit"
                        class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 rounded">Send</button>
            </div>
            <div class="flex gap-2 items-center text-xs">
                <label class="text-gray-400">Start from an existing STEP file:</label>
                <input id="stepUpload" type="file" accept=".step,.stp" class="text-gray-400" onchange="uploadStep()">
            </div>
        </div>
    </div>

    <!-- RIGHT: 3D viewer -->
    <div id="canvasContainer" class="w-2/3 h-full bg-black relative">
        <div id="loadingOverlay" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-50">
            <span class="text-lg font-medium tracking-wide text-blue-400 animate-pulse">Compiling geometry...</span>
        </div>
        <div class="absolute top-3 right-3 z-40 flex gap-2">
            <a id="downloadStep" class="hidden bg-green-600 hover:bg-green-500 text-white text-sm font-medium px-3 py-2 rounded" download>Download .STEP (SolidWorks/AutoCAD)</a>
            <a id="downloadStl" class="hidden bg-gray-700 hover:bg-gray-600 text-white text-sm font-medium px-3 py-2 rounded" download>Download .STL</a>
        </div>
    </div>

    <script>
       // Backend URL resolution order:
       //   1. window.APP_CONFIG.BACKEND_URL — set this ONLY if you need to
       //      force a specific backend regardless of where this page is
       //      served from (e.g. testing the prod frontend against the prod
       //      backend from localhost). Leave it empty/unset for normal use
       //      so same-origin and ?backend= below can do their job.
       //   2. ?backend=https://your-backend  query parameter
       //   3. same origin the page was served from (works when the backend
       //      also serves index.html, which is the normal deployment mode)
       window.APP_CONFIG = window.APP_CONFIG || { BACKEND_URL: "" };
       const BACKEND_URL = (window.APP_CONFIG.BACKEND_URL
           || new URLSearchParams(window.location.search).get('backend')
           || window.location.origin
       ).replace(/\/+$/, '');
        let scene, camera, renderer, controls, currentMesh;
        const container = document.getElementById('canvasContainer');
        let sessionId = localStorage.getItem('cim_session_id') || null;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111827);
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(100, 100, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 100, 50);
            scene.add(dirLight);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function loadSTL(url) {
            const loader = new THREE.STLLoader();
            loader.load(url, function (geometry) {
                if (currentMesh) scene.remove(currentMesh);
                const material = new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4, metalness: 0.2 });
                currentMesh = new THREE.Mesh(geometry, material);
                geometry.center();
                scene.add(currentMesh);
                camera.position.set(80, 80, 80);
                controls.reset();
            });
        }

        function addChatBubble(role, text) {
            const log = document.getElementById('chatLog');
            const bubble = document.createElement('div');
            bubble.className = role === 'user'
                ? 'bg-blue-600/30 border border-blue-600/50 rounded p-2 ml-6'
                : 'bg-gray-700/50 border border-gray-600 rounded p-2 mr-6';
            bubble.innerText = text;
            log.appendChild(bubble);
            log.scrollTop = log.scrollHeight;
        }

        async function sendPrompt() {
            const input = document.getElementById('promptInput');
            const prompt = input.value.trim();
            if (!prompt) return;
            addChatBubble('user', prompt);
            input.value = '';
            document.getElementById('loadingOverlay').classList.remove('hidden');

            try {
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: prompt })
                });
                const data = await response.json();

                if (!response.ok) {
                    addChatBubble('assistant', `Error: ${data.detail}`);
                    return;
                }

                sessionId = data.session_id;
                localStorage.setItem('cim_session_id', sessionId);

                document.getElementById('codeOutput').innerText = data.code;
                loadSTL(BACKEND_URL + data.stl_url);

                const stepLink = document.getElementById('downloadStep');
                stepLink.href = BACKEND_URL + data.step_url;
                stepLink.classList.remove('hidden');

                const stlLink = document.getElementById('downloadStl');
                stlLink.href = BACKEND_URL + data.stl_url;
                stlLink.classList.remove('hidden');

                addChatBubble('assistant', 'Model updated — preview on the right, STEP file ready to download.');
            } catch (err) {
                addChatBubble('assistant', 'Cannot reach backend. Is main.py running?');
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        async function uploadStep() {
            const fileInput = document.getElementById('stepUpload');
            if (!fileInput.files.length) return;
            const formData = new FormData();
            if (sessionId) formData.append('session_id', sessionId);
            formData.append('file', fileInput.files[0]);

            document.getElementById('loadingOverlay').classList.remove('hidden');
            try {
                const response = await fetch(`${BACKEND_URL}/upload_step`, { method: 'POST', body: formData });
                const data = await response.json();
                if (!response.ok) {
                    addChatBubble('assistant', `Upload error: ${data.detail}`);
                    return;
                }
                sessionId = data.session_id;
                localStorage.setItem('cim_session_id', sessionId);
                loadSTL(BACKEND_URL + data.stl_url);
                addChatBubble('assistant', 'Uploaded STEP file loaded. Describe what you want to change or add.');
            } catch (err) {
                addChatBubble('assistant', 'Upload failed. Is main.py running?');
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        }

        document.getElementById('promptInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendPrompt();
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        init3D();
    </script>
</body>
</html>
